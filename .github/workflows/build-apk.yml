name: Build Blue Big Fish V19 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'blue-big-fish-v18-apk-upload.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q blue-big-fish-v18-apk-upload.zip -d source

      - name: Build APK
        run: gradle --no-daemon -p source/blue-big-fish-v13 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-big-fish-v19-apk
          path: source/blue-big-fish-v13/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
